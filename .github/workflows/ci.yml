name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autohub_test
          POSTGRES_USER: autohub
          POSTGRES_PASSWORD: autohub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & test
        run: ./mvnw verify -B -Dspring.datasource.url=jdbc:postgresql://localhost:5432/autohub_test
        env:
          SPRING_DATASOURCE_USERNAME: autohub
          SPRING_DATASOURCE_PASSWORD: autohub
          SPRING_DATA_REDIS_HOST: localhost
          AUTOHUB_JWT_SECRET: ci-secret-key-must-be-at-least-256-bits-long-for-hs256
          AUTOHUB_JWT_ACCESS_TOKEN_EXPIRATION_MS: 900000
          AUTOHUB_JWT_REFRESH_TOKEN_EXPIRATION_MS: 604800000

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: autohub-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
